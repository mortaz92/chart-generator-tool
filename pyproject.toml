[tool.poetry]
name = "chart-generator-tool"
version = "0.1.0"
description = "Trading setup chart generator for CrewAI"
authors = ["Your Name <your@email.com>"]

[tool.poetry.dependencies]
python = ">=3.10,<3.13"
crewai = {extras = ["tools"], version = ">=0.80.0"}
matplotlib = ">=3.7.0"
requests = ">=2.31.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"