
services:
  - type: web
    name: trading-chart-dashboard
    runtime: python
    buildCommand: "cd frontend && npm install && npm run build && cd .. && rm -rf static && mv frontend/dist static && pip install -r requirements.txt"
    startCommand: "gunicorn app:app"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
